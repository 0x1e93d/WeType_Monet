name: Build and Release Wetype Monet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "config/base.json"
      - "config/module.json"
      - "module_template/**"
      - "overlay/**"
      - "scripts/**"
      - "tests/**"

  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wetype-monet-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run mapping tests
        run: python -m unittest discover -s tests -v
      - name: Check build script syntax
        run: python -B -c "from pathlib import Path; compile(Path('scripts/build.py').read_text(encoding='utf-8'), 'scripts/build.py', 'exec')"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner
          APKTOOL_VER="2.9.3"
          APKTOOL_COMMIT="3bb7888eb47103a1ba13c86b8a90a4d9614c9e7c"
          APKTOOL_SCRIPT_SHA256="2e18434d91810bef9cd562bb486246eaec08ac368f0d810214a57b6c3a967ae7"
          APKTOOL_JAR_SHA256="7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/${APKTOOL_COMMIT}/scripts/linux/apktool" \
            --output /tmp/apktool
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            --output /tmp/apktool.jar
          echo "${APKTOOL_SCRIPT_SHA256}  /tmp/apktool" | sha256sum --check --status
          echo "${APKTOOL_JAR_SHA256}  /tmp/apktool.jar" | sha256sum --check --status
          sudo install -m 0755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 0644 /tmp/apktool.jar /usr/local/bin/apktool.jar

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump module patch version for source changes
        if: github.event_name == 'push'
        run: python scripts/version.py bump-patch

      - name: Build module
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          VERSION_CODE: ${{ github.run_number }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: python scripts/build.py

      - name: Read build metadata
        id: metadata
        run: |
          if [ ! -f out/internal/build-metadata.json ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          metadata = json.loads(Path("out/internal/build-metadata.json").read_text(encoding="utf-8"))
          for key, value in metadata.items():
              print(f"{key}={value}")
          PY

      - name: Collect submitted changes
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git log -1 --format='- %s (%h)' "$AFTER_SHA"
          else
            git log --format='- %s (%h)' "$BEFORE_SHA..$AFTER_SHA"
          fi >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit generated configuration and version
        if: steps.metadata.outputs.built == 'true'
        run: |
          git add config/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(release): update module and target configuration"
          git push

      - name: Upload build artifacts
        if: steps.metadata.outputs.built == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wetype-monet-${{ github.run_number }}
          path: |
            out/*.zip
            out/*.json

      - name: Create release
        if: steps.metadata.outputs.built == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 微信输入法 Monet ${{ steps.metadata.outputs.module_version }}
          body: |
            ## 微信输入法 Monet 自动适配

            - 模块版本：${{ steps.metadata.outputs.module_version }}
            - 发布序号：${{ steps.metadata.outputs.version_code }}
            - 适配版本：微信输入法 ${{ steps.metadata.outputs.apk_name }} (${{ steps.metadata.outputs.apk_code }})
            - 构建时间：${{ steps.metadata.outputs.build_time }}

            ### 本次变更
            ${{ steps.changes.outputs.summary || '- 自动检测到上游 APK 更新，模块展示版本保持不变。' }}

            ### 产物
            - `${{ steps.metadata.outputs.zip_file }}`：Magisk/KernelSU Overlay 模块
            - `${{ steps.metadata.outputs.config_file }}`：当前版本资源映射配置
          files: |
            out/*.zip
            out/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
