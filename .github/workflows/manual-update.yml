name: Manual force update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "强制生成新的模块版本"
        required: true
        type: boolean
        default: true
      apk_url:
        description: "官方 APK 直链（可选，留空使用默认下载地址）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: inputs.confirm == true
    uses: ./.github/workflows/auto-update.yml
    with:
      force_build: true
      apk_url: ${{ inputs.apk_url }}
    secrets: inherit
