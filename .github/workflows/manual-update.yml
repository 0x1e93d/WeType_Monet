name: Manual force update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "强制生成新的模块版本"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    if: inputs.confirm == true
    uses: ./.github/workflows/auto-update.yml
    with:
      force_build: true
    secrets: inherit
