name: Build Wetype Monet Overlay

on:
  push:
    branches:
      - main
  # schedule:
  #   # 每天 UTC 00:00 (北京时间 08:00) 自动检查更新
  #   - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 赋予提交 config JSON 和发布 Release 的写入权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Tools
        run: |
          # 仅安装 apktool 和 zipalign 等，不再从 apt 安装旧版 aapt
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner wget
          
          # 安装 apktool
          APKTOOL_VER="2.9.3"
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Build Script
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          python3 scripts/build.py

      - name: Commit Updated Config JSON to Repo
        id: commit_config
        run: |
          git add config/*.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有新的配置文件变动。"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git commit -m "chore(config): auto-update version config from build workflow"
            git push
            echo "已成功提交最新的配置文件至仓库。"
          fi

      - name: Upload Output Artifacts (ZIP & JSON)
        uses: actions/upload-artifact@v4
        with:
          name: Wetype-Monet-Artifacts
          path: |
            out/*.zip
            out/*.json

      - name: Create Release
        if: steps.commit_config.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "微信输入法 Monet Overlay Auto-Build"
          body: |
            自动化适配构建完成！
            
            - 📦 **模块包**: 包含编译完成的 Overlay Magisk/KernelSU ZIP 刷机包。
            - 📄 **配置文件**: 包含当前版本提取的适配 JSON 配置。
          files: |
            out/*.zip
            out/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}