name: Auto Update & Build KSU Module

on:
#   schedule:
    # 每天定时检查更新 (UTC 时间 0:00，即北京时间 8:00)
    # 注意：cron 表达式必须用单引号包裹
    # - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Java 环境 (Apktool 依赖)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装系统依赖与 Python 库
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip
          pip install beautifulsoup4

      - name: 运行 update.py 自动检测更新与构建
        id: run_update
        run: |
          # 运行升级脚本，该脚本内部会在更新时自动调用 build.py
          python3 scripts/update.py
          
          # 查找 config/ 下除了 base_colors.json 外最新生成的 JSON 文件
          LATEST_JSON=$(ls -t config/*.json 2>/dev/null | grep -v "base_colors.json" | head -n 1 || true)
          
          if [ -n "$LATEST_JSON" ]; then
            echo "JSON_PATH=${LATEST_JSON}" >> $GITHUB_ENV
            echo "JSON_FILENAME=$(basename "${LATEST_JSON}")" >> $GITHUB_ENV
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
            echo "未发现新版本的配置文件，可能未检测到版本更新。"
          fi

      - name: 读取模块信息 (确定 Zip 名称)
        if: env.HAS_UPDATE == 'true'
        run: |
          if [ -f "module.prop" ]; then
            MODULE_ID=$(grep -E "^id=" module.prop | cut -d'=' -f2 | tr -d '\r')
            VERSION=$(grep -E "^version=" module.prop | cut -d'=' -f2 | tr -d '\r')
          else
            MODULE_ID="WeType_Overlay"
            VERSION="latest"
          fi
          echo "ZIP_NAME=${MODULE_ID}_${VERSION}.zip" >> $GITHUB_ENV

      - name: 上传产物 1：版本 JSON 文件
        if: env.HAS_UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JSON_FILENAME }}
          path: ${{ env.JSON_PATH }}
          if-no-files-found: error

      - name: 上传产物 2：KernelSU 模块压缩包 (.zip)
        if: env.HAS_UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error