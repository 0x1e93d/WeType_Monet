name: Auto Update & Build KSU Module

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 自动检查更新
  workflow_dispatch: # 允许手动点击运行

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 设置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装系统依赖与 Python 库
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip
          pip install beautifulsoup4

      - name: 运行升级与构建脚本
        run: python3 scripts/update.py

      - name: 上传所有输出产物 (JSON + Zip)
        uses: actions/upload-artifact@v4
        with:
          name: Wetype-Module-Artifacts
          path: out/*
          if-no-files-found: error
          retention-days: 7