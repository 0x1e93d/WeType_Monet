name: Force update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "强制生成新的模块版本"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    if: inputs.confirm == true
    uses: ./.github/workflows/release.yml
    with:
      force_version: true
    secrets: inherit
