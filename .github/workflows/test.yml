name: Test build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "官方 APK 直链（可选，留空使用默认下载地址）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
      apk_url: ${{ inputs.apk_url }}
    secrets: inherit
