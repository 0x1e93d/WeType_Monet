name: Auto check WeType version and release

on:
  # 自动检查与手动更新共用构建流程。
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"

  workflow_call:
    inputs:
      force_build:
        description: "强制生成新的模块版本"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: wetype-monet-release
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: |
          python -B - <<'PY'
          from pathlib import Path

          for directory in ("scripts", "tests"):
              for script_path in sorted(Path(directory).rglob("*.py")):
                  compile(script_path.read_text(encoding="utf-8"), str(script_path), "exec")
          PY
      - name: Check shell script syntax
        shell: bash
        run: |
          for file in module_template/*.sh module_template/META-INF/com/google/android/update-binary; do
            sh -n "$file"
          done

  build:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup build tools
        uses: ./.github/actions/setup-build

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build module
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: python scripts/build.py

      - name: Read build metadata
        id: metadata
        run: |
          if [ ! -f out/internal/build-metadata.json ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])

          def set_output(key, value):
              value = str(value)
              delimiter = f"ghadelimiter_{uuid.uuid4().hex}"
              with output_path.open("a", encoding="utf-8") as output:
                  output.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")

          metadata = json.loads(Path("out/internal/build-metadata.json").read_text(encoding="utf-8"))
          for key, value in metadata.items():
              set_output(key, value)

          version_mapping = json.loads(
              (Path("config") / metadata["config_file"]).read_text(encoding="utf-8")
          )
          changelog = [
              str(item).replace("\r", " ").replace("\n", " ").strip()
              for item in version_mapping.get("changelog", [])
              if str(item).strip()
          ]
          set_output(
              "official_changelog",
              "\n".join(f"- {item}" for item in changelog) or "- 暂无可展示的官方更新日志。",
          )
          PY

      - name: Upload build artifacts
        if: steps.metadata.outputs.built == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wetype-monet-${{ steps.metadata.outputs.release_tag }}
          path: |
            out/${{ steps.metadata.outputs.zip_file }}
            out/${{ steps.metadata.outputs.official_apk_file }}
            out/${{ steps.metadata.outputs.monet_apk_file }}

      - name: Create release
        if: steps.metadata.outputs.built == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.release_title }}
          body: |
            ## 微信输入法 Monet

            已适配微信输入法 ${{ steps.metadata.outputs.apk_name }} (${{ steps.metadata.outputs.apk_code }})。

            ### 微信输入法官方更新日志
            ${{ steps.metadata.outputs.official_changelog }}

            ### 下载
            - `${{ steps.metadata.outputs.zip_file }}`：用于 Magisk/KernelSU 的 Monet Overlay 模块。
            - `${{ steps.metadata.outputs.monet_apk_file }}`：保持官方包名、写入 Monet 资源的独立安装包。
            - `${{ steps.metadata.outputs.official_apk_file }}`：本次构建下载的官方微信输入法原始 APK。

            ### 构建信息
            - 模块版本：${{ steps.metadata.outputs.module_version }}（版本代码：${{ steps.metadata.outputs.version_code }}）
            - 构建时间：${{ steps.metadata.outputs.build_time }}
            - 构建来源：${{ inputs.force_build && '手动更新' || '自动更新' }}
            - 资源映射：`config/${{ steps.metadata.outputs.config_file }}`
          files: |
            out/${{ steps.metadata.outputs.zip_file }}
            out/${{ steps.metadata.outputs.official_apk_file }}
            out/${{ steps.metadata.outputs.monet_apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated release state
        if: steps.metadata.outputs.built == 'true'
        run: |
          git add CHANGELOG.md config/latest.json config/mappings/ wetype_monet.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 更新发布状态与资源映射"
          git push
